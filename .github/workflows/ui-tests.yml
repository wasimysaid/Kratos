name: UI tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/run-macos-browser-fixture.sh'

      - 'scripts/fixtures/preview-server/**'
      - 'dist/macos/Info.plist'
      - 'apps/ios/**'
      - '.github/workflows/ui-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/run-macos-browser-fixture.sh'

      - 'scripts/fixtures/preview-server/**'
      - 'dist/macos/Info.plist'
      - 'apps/ios/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-sync-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: OpenCode protocol and permission regressions
        run: |
          cargo test --locked -p zeron-harness --lib opencode::
          cargo test --locked -p zeron-harness --test opencode
      - name: Durable session publication and recovery
        run: |
          cargo test --locked -p zeron-sync --lib
          cargo test --locked -p zeron-update --lib
          cargo test --locked -p zeron-engine --lib --test session_publication --test restart_resume --test codex_subagents --test local_profiles
      - name: Agent availability and case-sensitive executable discovery
        run: cargo test --locked -p zeron-harness --lib --test acp --test claude_availability

  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: GPUI system dependencies
        run: |
          # Only Ubuntu packages are needed; unrelated runner repositories can be out of sync.
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: UI and headless layout regressions
        run: cargo test --release --locked -p zeron-ui --lib -- --test-threads=1

  macos-frame-recovery:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Check out pinned GPUI for native frame-source tests
        shell: bash
        run: |
          rev=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["dependencies"]["gpui"]["rev"])')
          git init frame-source-tests
          git -C frame-source-tests remote add origin https://github.com/wasimysaid/zui
          git -C frame-source-tests fetch --depth=1 origin "$rev"
          git -C frame-source-tests checkout --detach FETCH_HEAD
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            frame-source-tests
      - name: Check macOS application
        run: cargo check --release --locked -p zeron
      - name: Native diff font geometry regression
        run: cargo test --release --locked -p zeron-ui --lib native_diff_font_geometry -- --test-threads=1
      - name: Native notification click regressions
        run: |
          cargo test --release --locked -p zeron-ui --lib notify::tests:: -- --test-threads=1
      - name: Build native browser fixture
        run: cargo build --release --locked -p zeron-ui --example browser-fixture --example preview-fixture --features browser-fixture
      - name: Native browser regression and screenshots
        timeout-minutes: 3
        env:
          RUST_BACKTRACE: 1
        run: |
          bash scripts/run-macos-browser-fixture.sh target/release/examples/browser-fixture "$RUNNER_TEMP/browser-captures"
          test -f "$RUNNER_TEMP/browser-captures/result.txt"
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-macos-captures
          path: ${{ runner.temp }}/browser-captures
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install preview fixture server
        run: npm ci --prefix scripts/fixtures/preview-server
      - name: Project discovery, stable URLs and HMR in native WebKit
        timeout-minutes: 3
        env:
          ZERON_PREVIEW_AUTO_OPEN: 1
        run: |
          VITE_BINARY="$GITHUB_WORKSPACE/scripts/fixtures/preview-server/node_modules/vite/bin/vite.js" bash scripts/run-macos-browser-fixture.sh target/release/examples/preview-fixture "$RUNNER_TEMP/preview-captures"
          test -f "$RUNNER_TEMP/preview-captures/result.txt"
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-macos-captures
          path: ${{ runner.temp }}/preview-captures
          if-no-files-found: ignore
      - name: Native frame-source recovery regression
        working-directory: frame-source-tests
        run: cargo test --release --locked -p gpui_macos --test frame_source_recovery

  ios-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: connectivity/tailcat/go.sum
      - name: Build pinned Tailcat XCFramework
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          GOMOBILE="$(go env GOPATH)/bin/gomobile" scripts/build-tailcat.sh xcframework
          test -d target/tailcat/KratosTailcat.xcframework
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          iphones = [device for runtime, group in devices.items() if "iOS" in runtime
                     for device in group if device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No iPhone simulator is installed")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("IOS_SIMULATOR_ID=" + iphones[0]["udid"] + "\n")
          PYTHON
      - name: Run iOS unit tests
        working-directory: apps/ios
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/ios-derived-data"
          CI_ENTITLEMENTS="$GITHUB_WORKSPACE/apps/ios/CI/Simulator.entitlements"
          # Let Xcode sign the host and embedded XCTest bundle as one coherent
          # tree. Re-signing only Zeron.app after build-for-testing invalidates
          # the launch contract between the host and its nested test bundle.
          EXPECTED_TEAM_ID="5XY3M483YQ"
          EXPECTED_APP_ID="$EXPECTED_TEAM_ID.sh.zeron.ios"
          SIGNING_ARGS=(
            CODE_SIGN_IDENTITY="-"
            CODE_SIGN_STYLE=Manual
            CODE_SIGNING_ALLOWED=YES
            CODE_SIGNING_REQUIRED=NO
          )
          xcodebuild -project Zeron.xcodeproj -scheme Zeron \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:ZeronTests "${SIGNING_ARGS[@]}" build-for-testing

          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Zeron.app"
          # Xcode 26 keeps simulator-only capabilities in the Mach-O's
          # simulated entitlement payload; the ad-hoc signature is empty.
          SIMULATED_ENTITLEMENTS="$DERIVED_DATA/Build/Intermediates.noindex/Zeron.build/Debug-iphonesimulator/Zeron.build/Zeron.app-Simulated.xcent"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -f "$SIMULATED_ENTITLEMENTS"
          test "$(plutil -extract application-identifier raw "$SIMULATED_ENTITLEMENTS")" = "$EXPECTED_APP_ID"
          test "$(plutil -extract 'com\.apple\.developer\.team-identifier' raw "$SIMULATED_ENTITLEMENTS")" = "$EXPECTED_TEAM_ID"
          test "$(plutil -extract get-task-allow raw "$SIMULATED_ENTITLEMENTS")" = "true"
          test "$(plutil -extract keychain-access-groups.0 raw "$SIMULATED_ENTITLEMENTS")" = "$EXPECTED_APP_ID"

          xcodebuild -project Zeron.xcodeproj -scheme Zeron \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            -only-testing:ZeronTests test-without-building
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore

  linux-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Native browser and GPUI dependencies
        run: |
          # Only Ubuntu packages are needed; unrelated runner repositories can be out of sync.
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev \
            libfreetype-dev libasound2-dev libvulkan-dev pkg-config cmake \
            libwebkit2gtk-4.1-dev libjson-glib-dev xvfb xdotool openbox \
            weston ffmpeg imagemagick fonts-noto-cjk
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build browser fixture
        run: cargo build --release --locked -p zeron-ui --example browser-fixture --features browser-fixture
      - name: X11 and Wayland browser regressions
        timeout-minutes: 5
        env:
          RUST_LOG: gpui_wgpu=info
        run: |
          scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/default"
          VK_DRIVER_FILES=/dev/null scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/opengl"
      - name: Upload native browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-browser
          path: ${{ runner.temp }}/linux-browser
          if-no-files-found: warn
