[package]
name = "kratos-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kratos-doc.workspace = true
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"

sha2 = "0.10"

# NWPathMonitor bridge (net_path.rs) — the update handler is an ObjC block.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"

[features]
# In-process registry peer for protocol and engine integration tests.
mock-server = []

[dev-dependencies]
chrono.workspace = true
reqwest.workspace = true
kratos-proto.workspace = true
tempfile.workspace = true
# `start_paused` virtual-clock tests (the 2026-07-30 sync-stall regressions).
tokio = { workspace = true, features = ["test-util"] }


[[test]]
name = "registry_client"
required-features = ["mock-server"]
