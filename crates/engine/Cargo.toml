[package]
name = "kratos-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kratos-preview.workspace = true
kratos-proto.workspace = true
kratos-doc.workspace = true
kratos-sync.workspace = true
kratos-harness.workspace = true
kratos-rpc.workspace = true
kratos-update.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"

axum = { version = "0.8", features = ["json"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
nucleo-matcher.workspace = true

tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tokio-tungstenite.workspace = true
# In-process registry server for the two-engine workspace integration tests.
kratos-sync = { workspace = true, features = ["mock-server"] }
